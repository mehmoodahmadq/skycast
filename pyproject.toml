[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skycast"
dynamic = ["version"]
description = "Real weather, rendered as animated ASCII art in your terminal."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["weather", "ascii", "cli", "terminal", "ansi", "open-meteo"]
authors = [{ name = "Mehmood Ahmad" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mehmoodahmadq/skycast"
Issues = "https://github.com/mehmoodahmadq/skycast/issues"

[project.scripts]
skycast = "skycast.cli:main"

[tool.hatch.version]
path = "src/skycast/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/skycast"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM117 wants nested `with` blocks merged, but the readable way to do that is
# parenthesised context managers, which need Python 3.10. The floor here is
# 3.9, so merging would mean over-long lines or backslash continuations.
# Revisit if the minimum ever moves to 3.10.
ignore = ["SIM117"]
